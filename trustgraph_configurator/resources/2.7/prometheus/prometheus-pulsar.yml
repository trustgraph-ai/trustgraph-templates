global:

  scrape_interval:     15s # By default, scrape targets every 15 seconds.

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
    monitor: 'trustgraph'

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:

  # The job name is added as a label `job=<job_name>` to any timeseries
  # scraped from this config.

  # TrustGraph services in processor groups
  - job_name: 'control'
    static_configs:
      - targets:
        - 'control:8000'

  - job_name: 'ingest'
    static_configs:
      - targets:
        - 'ingest:8000'

  - job_name: 'rag'
    static_configs:
      - targets:
        - 'rag:8000'

  - job_name: 'embeddings'
    static_configs:
      - targets:
        - 'embeddings:8000'

  - job_name: 'vector-store'
    static_configs:
      - targets:
        - 'vector-store:8000'

  - job_name: 'row-store'
    static_configs:
      - targets:
        - 'row-store:8000'

  - job_name: 'triple-store'
    static_configs:
      - targets:
        - 'triple-store:8000'

  - job_name: 'text-completion'
    static_configs:
      - targets:
        - 'text-completion:8000'

  # TrustGraph services standalone
  - job_name: 'api-gateway'
    static_configs:
      - targets:
        - 'api-gateway-metrics:8000'

  - job_name: 'mcp-server'
    static_configs:
      - targets:
        - 'mcp-server:8000'

  - job_name: 'document-decoder'
    static_configs:
      - targets:
        - 'document-decoder:8000'

  # Non-Trustgraph services
  - job_name: 'garage'
    metrics_path: '/metrics'
    static_configs:
      - targets:
        - 'garage:3903'

  - job_name: 'pulsar'
    metric_relabel_configs:
      # Step 1: Drop storage eviction metrics
      - source_labels: [__name__]
        regex: 'pulsar_storage_backlog_quota_exceeded_evictions_total'
        action: drop

      # Step 2: Drop non-backlog subscription telemetry (timestamps, rates, replays, etc.)
      - source_labels: [__name__]
        regex: 'pulsar_subscription_(dispatch_throttled.*|blocked_on_unacked.*|last_.*|msg_ack.*|msg_drop.*|in_replay|filter_.*|total_msg_.*)'
        action: drop

      # Step 3: Strip producer and consumer labels if still emitted
      - regex: '(producer|consumer)'
        action: labeldrop

    static_configs:
      - targets:
        - 'pulsar:8080'
